<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Cejas | Notas</title>
    <link
      rel="stylesheet"
      href="./styles/main.css"
    />
  </head>
  <body>
    <h1>📝 Mis Notas</h1>

    <form id="noteForm">
      <input
        type="text"
        id="title"
        placeholder="Título"
        required
      />
      <textarea
        id="content"
        placeholder="Contenido..."
        required
      ></textarea>
      <button type="submit">Crear nota</button>
    </form>

    <section id="notesContainer"></section>

    <script src="./scripts/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
