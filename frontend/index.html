<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Cejas - Notas</title>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
	</head>
	<body>
		<h1>📝 Cejas</h1>

		<form id="noteForm">
			<input
				type="text"
				id="title"
				placeholder="Título de la nota"
				required
			/>
			<textarea
				id="content"
				placeholder="Contenido de la nota"
				required
			></textarea>
			<button type="submit">Crear nota</button>
		</form>

		<section id="notesContainer"></section>

		<script src="main.js"></script>
	</body>
</html>
